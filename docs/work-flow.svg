<text x="1188.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">7 완료·보고</text>
<text x="1188.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">그대로 쓰게 낸다</text>
