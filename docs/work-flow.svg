<path d="M1163.0,183.0 C1163.0,-5.5 926.0,-5.5 926.0,181.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>
<rect x="1082.9753480000002" y="45.951296" width="69.375" height="18" rx="3" fill="white"/>
<text x="1117.6628480000002" y="59.951296" text-anchor="middle" font-size="12.5" fill="#92400e">고쳐 달라</text>
<path d="M1228.0,247.0 C1228.0,465.4 312.0,465.4 312.0,249.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>
