<text x="829.1630719999999" y="108.781824" text-anchor="middle" font-size="12.5" fill="#92400e">판단이 틀렸다</text>
<path d="M1007.0,183.0 C1007.0,40.0 604.0,40.0 604.0,181.0" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#r)"/>
