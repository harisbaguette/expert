<rect x="800.1875" y="266.0" width="45.625" height="18" rx="3" fill="white"/>
<text x="823.0" y="280.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">걸리면</text>
<rect x="86.0" y="55.0" width="220" height="66" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="196.0" y="75.0" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">긴급 경로</text>
<text x="196.0" y="94.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">피해가 분마다 커지면 1~3 건너뛰고</text>
<text x="196.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">되돌릴 수 있는 첫 조치부터</text>
