<text x="312.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">끝을 정한다</text>
<line x1="378.0" y1="215" x2="390.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="392.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="458.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">2 문제 정의</text>
<text x="458.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">풀 문제를 짚는다</text>
<line x1="524.0" y1="215" x2="536.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="538.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="604.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">3 자료 확인</text>
<text x="604.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">사실을 가른다</text>
<line x1="670.0" y1="215" x2="682.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="684.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="750.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">4 판단·계획</text>
<text x="750.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">끝까지 그려 본다</text>
<line x1="816.0" y1="215" x2="828.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="830.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="896.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">5 처리</text>
<text x="896.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">결과물을 만든다</text>
<line x1="962.0" y1="215" x2="974.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="976.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1042.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">6 검증</text>
<text x="1042.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">실제 상태를 본다</text>
<line x1="1108.0" y1="215" x2="1120.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
