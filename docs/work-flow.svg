<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 485" width="1440" height="485" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1440" height="485" fill="white"/>
<text x="1430" y="477" text-anchor="end" font-size="12" fill="#475569">실선 = 앞으로 가는 길 · 주황 점선 = 되돌아가는 길 · 빨강 = 사람에게 넘기거나 급한 길</text>
<circle cx="36" cy="215" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="36" y="220" text-anchor="middle" font-size="14" fill="#14532d">시작</text>
<line x1="60" y1="215" x2="98.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="100.0" y="183.0" width="132" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="166.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">0 감지·접수</text>
<text x="166.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">받을지 정한다</text>
<line x1="232.0" y1="215" x2="244.0" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
