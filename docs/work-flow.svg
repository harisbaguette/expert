<text x="1334.0" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#17314f">8 남기기</text>
<text x="1334.0" y="233" text-anchor="middle" font-size="13" fill="#17314f">다음 건에 남긴다</text>
