<text x="1137.1755520000002" y="425.5818240000001" text-anchor="middle" font-size="12.5" fill="#92400e">기억은 다음 건의 0으로 이어진다</text>
<rect x="653.0" y="307.0" width="300" height="74" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="803.0" y="329.0" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">사람에게 넘기기 — 다섯 경우에만 멈춘다</text>
<text x="803.0" y="349.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">되돌릴 수 없는 행동 · 승인 조건 · 판단이 안 섬</text>
<text x="803.0" y="367.0" text-anchor="middle" font-size="12.5" fill="#7f1d1d">한도 초과 · 자격자 전속 행위</text>
