<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">E의 개인 세금은 두 경로를 구별합니다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#FFD54F"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#FFD54F}</style><rect width="1200" height="520" fill="#141B2A"/><text x="32" y="49" font-size="32" font-weight="700" text-anchor="start">E의 개인 세금은 두 경로를 구별합니다</text><text x="32" y="103" font-size="24" font-weight="700" text-anchor="start">개인에게 돌아간 돈이나 이익</text><g class="card"><rect x="32" y="123" width="352" height="122" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="54" y="171" font-size="27" font-weight="700" text-anchor="start">A의 돈을</text><text x="54" y="211" font-size="24" font-weight="500" text-anchor="start">E의 개인 빚·소비에 사용</text></g><g class="card"><rect x="424" y="123" width="352" height="122" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="446" y="171" font-size="27" font-weight="700" text-anchor="start">E에게 돌아간 이익</text><text x="446" y="211" font-size="24" font-weight="500" text-anchor="start">상여·배당 등으로 분류</text></g><g class="card"><rect x="816" y="123" width="352" height="122" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="838" y="171" font-size="27" font-weight="700" text-anchor="start">소득세</text><text x="838" y="211" font-size="24" font-weight="500" text-anchor="start">E가 얻은 이익에 세금 계산</text></g><path d="M388 184 H415" fill="none" stroke="#FFD54F" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 184 H807" fill="none" stroke="#FFD54F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="301" font-size="24" font-weight="700" text-anchor="start">회사에 준 혜택 중 E의 주식 몫</text><g class="card"><rect x="32" y="322" width="352" height="127" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="54" y="359" font-size="27" font-weight="700" text-anchor="start">A의 이자 부담 감소</text><text x="54" y="391" font-size="23" font-weight="500" text-anchor="start">이자 없이 또는 낮은 이자로</text><text x="54" y="423" font-size="23" font-weight="500" text-anchor="start">돈을 빌려줌</text></g><g class="card"><rect x="424" y="322" width="352" height="127" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="446" y="366" font-size="25" font-weight="700" text-anchor="start">회사 혜택에서 법인세 차감</text><text x="446" y="407" font-size="24" font-weight="500" text-anchor="start">그 뒤 E의 주식 몫 계산</text></g><g class="card"><rect x="816" y="322" width="352" height="127" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="838" y="359" font-size="27" font-weight="700" text-anchor="start">증여세</text><text x="838" y="391" font-size="23" font-weight="500" text-anchor="start">회사·거래 상대·이익 금액이</text><text x="838" y="423" font-size="23" font-weight="500" text-anchor="start">법의 기준을 충족할 때</text></g><path d="M388 385 H415" fill="none" stroke="#FFD54F" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 385 H807" fill="none" stroke="#FFD54F" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="493" font-size="25" font-weight="600" text-anchor="start">A의 사업비로 썼는지와 회사가 받은 혜택의 주주 몫은 별도로 따집니다.</text></svg>