<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="title"><title id="title">B의 자체 상환 능력에 따른 D의 회수 위험 비교</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#82AAFF"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#FFD54F"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#82AAFF;font-size:26px;font-weight:500}.title{font-size:29px;font-weight:700}.node{font-size:24px;font-weight:700}.sub{font-size:23px}.gold{fill:#FFD54F}</style><rect width="100%" height="100%" rx="16" fill="#141B2A"/><text x="35" y="47" text-anchor="start" class="title">D의 돈이 위험해지는 지점</text><rect x="25" y="76" width="1150" height="135" rx="14" fill="#192337"/><rect x="25" y="232" width="1150" height="135" rx="14" fill="#192337"/><rect x="47" y="105" width="285" height="76" rx="13" fill="#21304A" stroke="#82AAFF" stroke-width="1.7"/><text x="189.5" y="153.0" text-anchor="middle" class="node">B가 자기 돈으로 갚음</text><path d="M332 143 H385" fill="none" stroke="#82AAFF" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="387" y="105" width="300" height="76" rx="13" fill="#21304A" stroke="#82AAFF" stroke-width="1.7"/><text x="537.0" y="153.0" text-anchor="middle" class="node">A가 못 갚아도</text><path d="M687 143 H740" fill="none" stroke="#82AAFF" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="742" y="105" width="404" height="76" rx="13" fill="#21304A" stroke="#82AAFF" stroke-width="1.7"/><text x="944.0" y="153.0" text-anchor="middle" class="node">D는 B에게 돌려받을 수 있음</text><rect x="47" y="261" width="285" height="76" rx="13" fill="#21304A" stroke="#82AAFF" stroke-width="1.7"/><text x="189.5" y="309.0" text-anchor="middle" class="node">B가 A에게 받아야 갚음</text><path d="M332 299 H385" fill="non