<g id="Q"><rect x="551.5" y="20.0" width="177.0" height="43.0" rx="21.5" fill="#dcfce7" stroke="#86d3a3" stroke-width="1.6"/><text x="640.0" y="41.5" text-anchor="middle" dominant-baseline="central" fill="#14532d" font-size="15">맡긴 업무 · 판단할 물음</text></g>
<g id="P"><rect x="525.5" y="121.0" width="229.0" height="97.0" fill="#dbeafe" stroke="#7dabe8" stroke-width="1.6"/><text x="640.0" y="146.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">① 물음 파악 (부품: 개념 · 관계)</text><text x="640.0" y="169.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">물음의 말을 개념 번호로 바꾸고</text><text x="640.0" y="192.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">전제가 개념·관계와 맞는지 본다</text></g>
<g id="dP"><polygon points="540.8,276.0 739.2,276.0 769.2,299.5 739.2,323.0 540.8,323.0 510.8,299.5" fill="#fef9c3" stroke="#e2c95f" stroke-width="1.6"/><text x="640.0" y="299.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">전제가 맞고 뜻이 하나인가</text></g>
<g id="T"><rect x="512.9" y="381.0" width="254.3" height="97.0" fill="#dbeafe" stroke="#7dabe8" stroke-width="1.6"/><text x="640.0" y="406.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">② 대상 확정 (부품: 개념 · 규칙)</text><text x="640.0" y="429.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">대상 번호를 하나로 정하고</text><text x="640.0" y="452.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">상위 개념과 규칙으로 종류를 정한다</text></g>
<g id="dT"><polygon points="547.2,536.0 732.8,536.0 762.8,559.5 732.8,583.0 547.2,583.0 517.2,559.5" fill="#fef9c3" stroke="#e2c95f" stroke-width="1.6"/><text x="640.0" y="559.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">후보 중 하나로 정해지나</text></g>
<g id="R"><rect x="470.3" y="641.0" width="339.4" height="74.0" fill="#dbeafe" stroke="#7dabe8" stroke-width="1.6"/><text x="640.0" y="666.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">③ 권한 거르기 (부품: 권한)</text><text x="640.0" y="689.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">이 사람과 이 업무가 볼 수 있는 개념·출처만 남긴다</text></g>
<g id="D"><rect x="453.1" y="773.0" width="373.8" height="143.0" fill="#dbeafe" stroke="#7dabe8" stroke-width="1.6"/><text x="640.0" y="798.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">④ 자료 모으기 (부품: 개념 · 관계 · 규칙 · 출처)</text><text x="640.0" y="821.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">기준 시점에 효력이 있는 판본만 모으고 출처 등급을 단다</text><text x="640.0" y="844.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">부딪치면 ‘앞선다’ 관계를 따라 고르고,</text><text x="640.0" y="867.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">점검 목록마다 필요한 증거가 찼는지 본다</text><text x="640.0" y="890.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">자료 자체가 없는 빈 곳은 표시해 넘긴다</text></g>
<g id="dD"><polygon points="532.3,974.0 747.7,974.0 777.7,997.5 747.7,1021.0 532.3,1021.0 502.3,997.5" fill="#fef9c3" stroke="#e2c95f" stroke-width="1.6"/><text x="640.0" y="997.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">자료를 모으다 막힌 곳이 있나</text></g>
<g id="I"><rect x="440.1" y="1079.0" width="399.7" height="120.0" fill="#dbeafe" stroke="#7dabe8" stroke-width="1.6"/><text x="640.0" y="1104.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">⑤ 전문 판단 (부품: 관계 · 규칙)</text><text x="640.0" y="1127.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">관계를 따라 사실을 잇고 전문 지식과 조건·예외를 적용한다</text><text x="640.0" y="1150.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">조건·예외가 조문에 정해진 계산은 규칙 엔진이 한다</text><text x="640.0" y="1173.5" text-anchor="middle" dominant-baseline="central" fill="#17314f" font-size="15">반대 근거와 갈리는 해석을 검토해 결론과 처리 방향을 정한다</text></g>
<g id="dI"><polygon points="547.2,1257.0 732.8,1257.0 762.8,1280.5 732.8,1304.0 547.2,1304.0 517.2,1280.5" fill="#fef9c3" stroke="#e2c95f" stroke-width="1.6"/><text x="640.0" y="1280.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">판단하다 막힌 곳이 있나</text></g>
<g id="C"><polygon points="440.1,1362.0 839.9,1362.0 869.9,1422.0 839.9,1482.0 440.1,1482.0 410.1,1422.0" fill="#fef9c3" stroke="#e2c95f" stroke-width="1.6"/><text x="640.0" y="1387.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">⑥ 판단 검사 (부품: 출처 · 권한)</text><text x="640.0" y="1410.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">쓴 자료의 권한을 다시 확인하고 직접 사실은 원문과 대조한다</text><text x="640.0" y="1433.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">계산·규칙 결론은 입력의 출처와 도출 과정을 확인한다</text><text x="640.0" y="1456.5" text-anchor="middle" dominant-baseline="central" fill="#713f12" font-size="15">조건·예외의 적용과 추론이 결론을 뒷받침하나</text></g>
<g id="A"><rect x="510.9" y="1540.0" width="258.2" height="120.0" rx="36.0" fill="#dcfce7" stroke="#86d3a3" stroke-width="1.6"/><text x="640.0" y="1565.5" text-anchor="middle" dominant-baseline="central" fill="#14532d" font-size="15">검증한 전문 판단</text><text x="640.0" y="1588.5" text-anchor="middle" dominant-baseline="central" fill="#14532d" font-size="15">결론 · 적용 조건 · 근거 · 처리 방향</text><text x="640.0" y="1611.5" text-anchor="middle" dominant-baseline="central" fill="#14532d" font-size="15">미확인 사항과 판단 범위를 밝히고,</text><text x="640.0" y="1634.5" text-anchor="middle" dominant-baseline="central" fill="#14532d" font-size="15">뒷받침할 수 없는 결론은 내지 않는다</text></g>
<g id="ASK"><rect x="30.0" y="262.5" width="181.6" height="74.0" fill="#fee2e2" stroke="#f0a3a3" stroke-width="1.6"/><text x="120.8" y="288.0" text-anchor="middle" dominant-baseline="central" fill="#7f1d1d" font-size="15">맡긴 사람에게 되묻거나</text><text x="120.8" y="311.0" text-anchor="middle" dominant-baseline="central" fill="#7f1d1d" font-size="15">전제를 바로잡는다</text></g>
<g id="DEC"><rect x="40.0" y="1102.0" width="198.5" height="74.0" fill="#fee2e2" stroke="#f0a3a3" stroke-width="1.6"/><text x="139.2" y="1127.5" text-anchor="middle" dominant-baseline="central" fill="#7f1d1d" font-size="15">사람에게 결정을 요청한다</text><text x="139.2" y="1150.5" text-anchor="middle" dominant-baseline="central" fill="#7f1d1d" font-size="15">근거와 대안을 붙여 넘긴다</text></g>
<g id="GAP"><rect x="989.9" y="1232.0" width="327.6" height="97.0" fill="#ffedd5" stroke="#f3b183" stroke-width="1.6"/><text x="1153.7" y="1257.5" text-anchor="middle" dominant-baseline="central" fill="#7c2d12" font-size="15">빈 곳 채우기</text><text x="1153.7" y="1280.5" text-anchor="middle" dominant-baseline="central" fill="#7c2d12" font-size="15">업무 지식이 개념·관계를 보태고 사람이 승인한다</text><text x="1153.7" y="1303.5" text-anchor="middle" dominant-baseline="central" fill="#7c2d12" font-size="15">승인 전에는 빈 곳을 밝혀 답하거나 삼간다</text></g>
