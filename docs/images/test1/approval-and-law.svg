<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title"><title id="title">허용 여부·승인 절차·거래조건은 서로 다른 판단입니다</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#FFD54F"/></marker></defs><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#FFD54F}</style><rect width="1200" height="460" fill="#141B2A"/><text x="32" y="49" font-size="31" font-weight="700" text-anchor="start">허용 여부·승인 절차·거래조건은 서로 다른 판단입니다</text><g class="card"><rect x="32" y="107" width="352" height="282" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="54" y="137" font-size="22" font-weight="700" text-anchor="start">법의 허용</text><text x="54" y="178" font-size="29" font-weight="700" text-anchor="start">지원 자체가</text><text x="54" y="214" font-size="29" font-weight="700" text-anchor="start">허용되는가?</text><text x="54" y="258" font-size="22" font-weight="500" text-anchor="start">상장 B·C가 누구를 돕는지</text><text x="54" y="290" font-size="22" font-weight="500" text-anchor="start">대여·보증 등이 금지되는지</text><text x="54" y="322" font-size="22" font-weight="500" text-anchor="start">비상장 D에는 이 특별 금지가</text><text x="54" y="354" font-size="22" font-weight="500" text-anchor="start">직접 적용되지 않음</text></g><g class="card"><rect x="424" y="107" width="352" height="282" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="446" y="137" font-size="22" font-weight="700" text-anchor="start">회사 내부의 승인</text><text x="446" y="178" font-size="29" font-weight="700" text-anchor="start">필요한 승인을</text><text x="446" y="214" font-size="29" font-weight="700" text-anchor="start">미리 받았는가?</text><text x="446" y="258" font-size="22" font-weight="500" text-anchor="start">누구의 이익이 걸렸는지 공개</text><text x="446" y="290" font-size="22" font-weight="500" text-anchor="start">승인 권한이 있는 곳에서 결정</text><text x="446" y="322" font-size="22" font-weight="500" text-anchor="start">이해관계자는 투표에서 제외</text><text x="446" y="354" font-size="22" font-weight="500" text-anchor="start">거래 내용·절차도 공정해야 함</text></g><g class="card"><rect x="816" y="107" width="352" height="282" rx="14" fill="#1B263A" stroke="#52647E" stroke-width="1.5"/><text x="838" y="137" font-size="22" font-weight="700" text-anchor="start">거래의 합리성</text><text x="838" y="178" font-size="29" font-weight="700" text-anchor="start">돈을 빌려주는 회사에</text><text x="838" y="214" font-size="29" font-weight="700" text-anchor="start">합리적인 조건인가?</text><text x="838" y="258" font-size="22" font-weight="500" text-anchor="start">상대방이 갚을 능력이 있는지</text><text x="838" y="290" font-size="22" font-weight="500" text-anchor="start">이자와 담보가 적절한지</text><text x="838" y="322" font-size="22" font-weight="500" text-anchor="start">돈을 빌려준 회사가 얻는 이익</text><text x="838" y="354" font-size="22" font-weight="500" text-anchor="start">E가 무엇을 알고 결정했는지</text></g><text x="32" y="432" font-size="25" font-weight="600" text-anchor="start">승인만 받았다고 법의 금지나 불리한 거래조건까지 해결되는 것은 아닙니다.</text></svg>